<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#857f74"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Title Block -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#1e1b18" font-family="Georgia, serif">SkillNexus-AI Architecture Specification</text>
  <text x="40" y="60" font-size="12" fill="#857f74">Multi-Agent Reactive Collaboration &amp; Deterministic Gap Analysis</text>

  <!-- Layer 1: Data Ingestion (x=40, y=90, w=260, h=390) -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="260" height="390" rx="8" fill="#fbf9f5" stroke="#e6dfd3"/>
    <rect width="260" height="34" rx="8" fill="#f3efe6"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#57524b">1. INGESTION &amp; BENCHMARKS</text>

    <!-- Block 1: Profile Store -->
    <g transform="translate(15, 50)">
      <rect width="230" height="70" rx="6" fill="#ffffff" stroke="#e6dfd3"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#1e1b18">Learner Credentials</text>
      <text x="12" y="36" font-size="9" fill="#57524b">Self-Reported Claimed Skills</text>
      <text x="12" y="50" font-size="9" fill="#857f74">Historical Assessment Registry</text>
    </g>

    <!-- Block 2: Industry Role Benchmarks -->
    <g transform="translate(15, 135)">
      <rect width="230" height="85" rx="6" fill="#ffffff" stroke="#e6dfd3"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#1e1b18">Role Benchmark Ontologies</text>
      <text x="12" y="36" font-size="9" fill="#57524b">6 Benchmark Roles (Full Stack, AI...)</text>
      <text x="12" y="50" font-size="9" fill="#57524b">Skill Weights (1–5) &amp; Req. Levels (1–5)</text>
      <text x="12" y="65" font-size="9" fill="#857f74">Prerequisite Dependency Graph (DAG)</text>
    </g>

    <!-- Block 3: Curated Resource Catalog -->
    <g transform="translate(15, 235)">
      <rect width="230" height="70" rx="6" fill="#ffffff" stroke="#e6dfd3"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#1e1b18">Authenticated Resource Index</text>
      <text x="12" y="36" font-size="9" fill="#57524b">1 Free Official Documentation</text>
      <text x="12" y="50" font-size="9" fill="#57524b">1 Deep Dive Production Course</text>
    </g>
  </g>

  <!-- Connectors from Layer 1 to Layer 2 -->
  <line x1="300" y1="210" x2="350" y2="210" stroke="#857f74" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="360" x2="350" y2="360" stroke="#857f74" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: 6 Specialized Agent Swarm (x=350, y=90, w=340, h=390) -->
  <g transform="translate(350, 90)" filter="url(#shadow)">
    <rect width="340" height="390" rx="8" fill="#fbf9f5" stroke="#e6dfd3"/>
    <rect width="340" height="34" rx="8" fill="#f3efe6"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#57524b">2. SPECIALIZED MULTI-AGENT SWARM</text>

    <!-- Agent 1 & 2 -->
    <g transform="translate(15, 45)">
      <rect width="145" height="58" rx="5" fill="#ffffff" stroke="#10b981"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#047857">🕵️ Profile Agent</text>
      <text x="10" y="32" font-size="8" fill="#57524b">Parses claims vs verified</text>
      <text x="10" y="44" font-size="8" fill="#857f74">Normalizes skill schemas</text>
    </g>

    <g transform="translate(180, 45)">
      <rect width="145" height="58" rx="5" fill="#ffffff" stroke="#3b82f6"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#1d4ed8">🎯 Gap Agent</text>
      <text x="10" y="32" font-size="8" fill="#57524b">Euclidean readiness calc</text>
      <text x="10" y="44" font-size="8" fill="#857f74">Ranks gaps by severity</text>
    </g>

    <!-- Agent 3 & 4 -->
    <g transform="translate(15, 115)">
      <rect width="145" height="58" rx="5" fill="#ffffff" stroke="#e6dfd3"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#1e1b18">🗺️ Curriculum Agent</text>
      <text x="10" y="32" font-size="8" fill="#57524b">DAG topological order</text>
      <text x="10" y="44" font-size="8" fill="#857f74">Hours &amp; outcome pacing</text>
    </g>

    <g transform="translate(180, 115)">
      <rect width="145" height="58" rx="5" fill="#ffffff" stroke="#e6dfd3"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#1e1b18">📚 Resource Agent</text>
      <text x="10" y="32" font-size="8" fill="#57524b">Maps 1 Free + 1 Paid</text>
      <text x="10" y="44" font-size="8" fill="#857f74">Strict zero-hallucination</text>
    </g>

    <!-- Agent 5 & 6 (The Adaptive Loop) -->
    <g transform="translate(15, 185)">
      <rect width="145" height="65" rx="5" fill="#ffffff" stroke="#f43f5e"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#be123c">📝 Assessor Agent</text>
      <text x="10" y="32" font-size="8" fill="#57524b">Diagnostic test banks</text>
      <text x="10" y="44" font-size="8" fill="#857f74">Concepts vs trivia grading</text>
    </g>

    <g transform="translate(180, 185)">
      <rect width="145" height="65" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="10" y="18" font-size="10" font-weight="700" fill="#b45309">🧠 Mentor Agent</text>
      <text x="10" y="32" font-size="8" fill="#78350f">Adaptive Re-planning</text>
      <text x="10" y="44" font-size="8" fill="#b45309">Computes AMBER DIFF</text>
      <text x="10" y="56" font-size="8" fill="#78350f">Injects remedial sprint</text>
    </g>

    <!-- State Bus -->
    <g transform="translate(15, 270)">
      <rect width="310" height="95" rx="6" fill="#25221e"/>
      <text x="15" y="24" font-size="11" font-weight="700" fill="#f59e0b">Event-Driven Handoff Bus (Live Stream)</text>
      <text x="15" y="42" font-size="9" font-family="monospace" fill="#e6dfd3">• Profile Agent audited 8 skills (3 verified, 5 gaps)</text>
      <text x="15" y="58" font-size="9" font-family="monospace" fill="#e6dfd3">• Gap Agent calculated readiness: 30.9%</text>
      <text x="15" y="74" font-size="9" font-family="monospace" fill="#10b981">• Assessor Agent → Mentor Agent: Intervention active</text>
    </g>
  </g>

  <!-- Connectors from Layer 2 to Layer 3 -->
  <line x1="690" y1="210" x2="740" y2="210" stroke="#857f74" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 740 380 Q 715 380 690 350" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="3" marker-end="url(#amberArrow)"/>

  <!-- Layer 3: Reactive 3D UI / Presentation Layer (x=740, y=90, w=220, h=390) -->
  <g transform="translate(740, 90)" filter="url(#shadow)">
    <rect width="220" height="390" rx="8" fill="#fbf9f5" stroke="#e6dfd3"/>
    <rect width="220" height="34" rx="8" fill="#f3efe6"/>
    <text x="15" y="22" font-size="12" font-weight="700" fill="#57524b">3. REACTIVE UI</text>

    <!-- Card 1: 3D Ring Gauge -->
    <g transform="translate(15, 50)">
      <rect width="190" height="85" rx="6" fill="#ffffff" stroke="#e6dfd3"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#1e1b18">3D Readiness Ring</text>
      <text x="12" y="38" font-size="16" font-weight="800" fill="#10b981">30.9%</text>
      <text x="65" y="38" font-size="9" fill="#857f74">(Claimed 53.6%)</text>
      <text x="12" y="55" font-size="8" fill="#be123c">Credibility Delta: -22.7%</text>
      <text x="12" y="70" font-size="8" fill="#57524b">Perspective Mouse Tilt (3D)</text>
    </g>

    <!-- Card 2: Amber Diff View -->
    <g transform="translate(15, 145)">
      <rect width="190" height="95" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="12" y="20" font-size="10" font-weight="800" fill="#b45309">⚡ Amber Diff Banner</text>
      <text x="12" y="36" font-size="9" fill="#78350f">Live Roadmap Rewriting</text>
      <text x="12" y="50" font-size="8" fill="#78350f">+12h Remedial Scope Sprint</text>
      <text x="12" y="64" font-size="8" fill="#78350f">Dependent React delayed</text>
      <text x="12" y="80" font-size="8" font-weight="700" fill="#b45309">Physical on-screen diff</text>
    </g>

    <!-- Card 3: Teleprompter -->
    <g transform="translate(15, 250)">
      <rect width="190" height="115" rx="6" fill="#ffffff" stroke="#e6dfd3"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#1e1b18">🎤 90s Judge Teleprompter</text>
      <text x="12" y="38" font-size="8" fill="#57524b">1. Problem statement hook</text>
      <text x="12" y="52" font-size="8" fill="#57524b">2. Aarav Patel (30.9% fit)</text>
      <text x="12" y="66" font-size="8" fill="#57524b">3. React/Node critical gaps</text>
      <text x="12" y="80" font-size="8" fill="#b45309">4. Check-in fail → Re-plan</text>
      <text x="12" y="94" font-size="8" fill="#57524b">5. Verifiable math close</text>
    </g>
  </g>
</svg>
