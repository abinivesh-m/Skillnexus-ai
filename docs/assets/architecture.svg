<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" style="background:#0c0f17; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="50" y="45" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">SkillNexus-AI: System Architecture &amp; Data Pipeline</text>
  <text x="50" y="68" font-size="12" fill="#94a3b8">Autonomous Multi-Agent Orchestration with Deterministic Euclidean Readiness Modeling</text>

  <!-- 3 Main Architecture Tiers -->

  <!-- TIER 1: Ingestion & Ontologies (x=50, y=95, w=280, h=490) -->
  <g transform="translate(50, 95)" filter="url(#cardShadow)">
    <rect width="280" height="490" rx="12" fill="rgba(18, 22, 34, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
    <rect width="280" height="38" rx="12" fill="rgba(255, 255, 255, 0.04)"/>
    <text x="20" y="24" font-size="11" font-family="monospace" font-weight="700" fill="#06b6d4" letter-spacing="1">1. INGESTION &amp; ONTOLOGIES</text>

    <!-- Card 1: Learner Credentials -->
    <g transform="translate(18, 55)">
      <rect width="244" height="95" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
      <rect width="4" height="95" rx="2" fill="url(#emeraldGrad)"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#ffffff">Learner Dossier Ingestion</text>
      <text x="14" y="40" font-size="10" fill="#94a3b8">• Self-Reported Claimed Skills (1–5)</text>
      <text x="14" y="56" font-size="10" fill="#94a3b8">• Diagnostic Assessment History</text>
      <text x="14" y="72" font-size="10" fill="#94a3b8">• Project Artifacts &amp; Transcripts</text>
      <text x="14" y="88" font-size="9" font-family="monospace" fill="#10b981">Verified State Registry</text>
    </g>

    <!-- Card 2: Industry Role Benchmarks -->
    <g transform="translate(18, 165)">
      <rect width="244" height="115" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
      <rect width="4" height="115" rx="2" fill="url(#cyanGrad)"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#ffffff">Industry Role Benchmarks</text>
      <text x="14" y="40" font-size="10" fill="#94a3b8">• 6 Enterprise Career Profiles</text>
      <text x="14" y="56" font-size="10" fill="#94a3b8">• Skill Weight Matrices (W: 1–5)</text>
      <text x="14" y="72" font-size="10" fill="#94a3b8">• Proficiency Thresholds (Req: 1–5)</text>
      <text x="14" y="88" font-size="10" fill="#94a3b8">• Prerequisite DAG Dependencies</text>
      <text x="14" y="104" font-size="9" font-family="monospace" fill="#06b6d4">Standardized Market Baseline</text>
    </g>

    <!-- Card 3: Authenticated Resources -->
    <g transform="translate(18, 295)">
      <rect width="244" height="95" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
      <rect width="4" height="95" rx="2" fill="url(#violetGrad)"/>
      <text x="14" y="22" font-size="12" font-weight="700" fill="#ffffff">Curated Resource Catalog</text>
      <text x="14" y="40" font-size="10" fill="#94a3b8">• Tier 1: Authoritative Free (MDN, Specs)</text>
      <text x="14" y="56" font-size="10" fill="#94a3b8">• Tier 2: Deep Production Courses</text>
      <text x="14" y="72" font-size="10" fill="#94a3b8">• 100% Authenticated Target URLs</text>
      <text x="14" y="88" font-size="9" font-family="monospace" fill="#8b5cf6">Zero Hallucinated Links</text>
    </g>

    <!-- Card 4: Assessment Test Banks -->
    <g transform="translate(18, 405)">
      <rect width="244" height="65" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
      <rect width="4" height="65" rx="2" fill="url(#amberGrad)"/>
      <text x="14" y="20" font-size="12" font-weight="700" fill="#ffffff">Diagnostic Assessment Bank</text>
      <text x="14" y="38" font-size="10" fill="#94a3b8">• Conceptual Fallacy Detectors</text>
      <text x="14" y="54" font-size="9" font-family="monospace" fill="#f59e0b">Real-Time Evaluation Probes</text>
    </g>
  </g>

  <!-- Flow Arrows Tier 1 -> Tier 2 -->
  <line x1="330" y1="215" x2="390" y2="215" stroke="#06b6d4" stroke-width="2" marker-end="url(#cyanArrow)"/>
  <line x1="330" y1="340" x2="390" y2="340" stroke="#06b6d4" stroke-width="2" marker-end="url(#cyanArrow)"/>

  <!-- TIER 2: 6 Specialized Collaborative Agents (x=390, y=95, w=380, h=490) -->
  <g transform="translate(390, 95)" filter="url(#cardShadow)">
    <rect width="380" height="490" rx="12" fill="rgba(18, 22, 34, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
    <rect width="380" height="38" rx="12" fill="rgba(255, 255, 255, 0.04)"/>
    <text x="20" y="24" font-size="11" font-family="monospace" font-weight="700" fill="#06b6d4" letter-spacing="1">2. MULTI-AGENT SWARM ENGINE</text>

    <!-- Agent Grid -->
    <!-- Profile Agent -->
    <g transform="translate(18, 50)">
      <rect width="165" height="70" rx="8" fill="rgba(16, 185, 129, 0.06)" stroke="rgba(16, 185, 129, 0.3)"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#10b981">🕵️ Profile Agent</text>
      <text x="12" y="36" font-size="9" fill="#94a3b8">Audits claimed vs verified</text>
      <text x="12" y="50" font-size="9" fill="#94a3b8">Normalizes skill schemas</text>
      <text x="12" y="63" font-size="8" font-family="monospace" fill="#10b981">Handoff → Gap Agent</text>
    </g>

    <!-- Gap Agent -->
    <g transform="translate(195, 50)">
      <rect width="165" height="70" rx="8" fill="rgba(6, 182, 212, 0.06)" stroke="rgba(6, 182, 212, 0.3)"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#06b6d4">🎯 Gap Agent</text>
      <text x="12" y="36" font-size="9" fill="#94a3b8">Euclidean math calculator</text>
      <text x="12" y="50" font-size="9" fill="#94a3b8">Ranks severity: Δ · Weight</text>
      <text x="12" y="63" font-size="8" font-family="monospace" fill="#06b6d4">Handoff → Curriculum</text>
    </g>

    <!-- Curriculum Agent -->
    <g transform="translate(18, 130)">
      <rect width="165" height="70" rx="8" fill="rgba(139, 92, 246, 0.06)" stroke="rgba(139, 92, 246, 0.3)"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#8b5cf6">🗺️ Curriculum Agent</text>
      <text x="12" y="36" font-size="9" fill="#94a3b8">Topological DAG sort</text>
      <text x="12" y="50" font-size="9" fill="#94a3b8">Estimates cognitive hours</text>
      <text x="12" y="63" font-size="8" font-family="monospace" fill="#8b5cf6">Handoff → Resource</text>
    </g>

    <!-- Resource Agent -->
    <g transform="translate(195, 130)">
      <rect width="165" height="70" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#ffffff">📚 Resource Agent</text>
      <text x="12" y="36" font-size="9" fill="#94a3b8">Binds 1 Free + 1 Paid</text>
      <text x="12" y="50" font-size="9" fill="#94a3b8">Zero-hallucination verification</text>
      <text x="12" y="63" font-size="8" font-family="monospace" fill="#94a3b8">Handoff → Assessor</text>
    </g>

    <!-- Assessor Agent -->
    <g transform="translate(18, 210)">
      <rect width="165" height="70" rx="8" fill="rgba(244, 63, 94, 0.06)" stroke="rgba(244, 63, 94, 0.3)"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#f43f5e">📝 Assessor Agent</text>
      <text x="12" y="36" font-size="9" fill="#94a3b8">Concept diagnostic check-ins</text>
      <text x="12" y="50" font-size="9" fill="#94a3b8">Evaluates conceptual depth</text>
      <text x="12" y="63" font-size="8" font-family="monospace" fill="#f43f5e">Handoff → Mentor</text>
    </g>

    <!-- Mentor Agent (Adaptive Core) -->
    <g transform="translate(195, 210)">
      <rect width="165" height="70" rx="8" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="12" y="20" font-size="11" font-weight="800" fill="#f59e0b">🧠 Mentor Agent</text>
      <text x="12" y="36" font-size="9" fill="#fde68a">Adaptive Re-planning</text>
      <text x="12" y="50" font-size="9" fill="#fde68a">Computes Amber Diff</text>
      <text x="12" y="63" font-size="8" font-family="monospace" fill="#f59e0b">Rewrites Curriculum</text>
    </g>

    <!-- Telemetry Bus -->
    <g transform="translate(18, 300)">
      <rect width="342" height="170" rx="8" fill="#07090e" stroke="rgba(6, 182, 212, 0.2)"/>
      <text x="15" y="24" font-size="11" font-family="monospace" font-weight="700" fill="#06b6d4">Real-Time Event Handoff Stream</text>
      <line x1="15" y1="34" x2="325" y2="34" stroke="rgba(255, 255, 255, 0.08)"/>

      <text x="15" y="55" font-size="9" font-family="monospace" fill="#94a3b8">[09:45:01] ProfileAgent: 8 skills audited · 3 verified, 5 gaps</text>
      <text x="15" y="75" font-size="9" font-family="monospace" fill="#94a3b8">[09:45:02] GapAgent: Euclidean fit calculated = 30.9%</text>
      <text x="15" y="95" font-size="9" font-family="monospace" fill="#94a3b8">[09:45:03] CurriculumAgent: 6 DAG sprints sequenced (118h)</text>
      <text x="15" y="115" font-size="9" font-family="monospace" fill="#94a3b8">[09:45:04] ResourceAgent: 12 authenticated URLs attached</text>
      <text x="15" y="135" font-size="9" font-family="monospace" fill="#f59e0b">[09:45:08] MentorAgent: Intervention active · Remedial module</text>
      <text x="15" y="155" font-size="8" font-family="monospace" fill="#10b981">● All 6 Specialized Agents Synchronized</text>
    </g>
  </g>

  <!-- Flow Arrows Tier 2 -> Tier 3 -->
  <line x1="770" y1="215" x2="830" y2="215" stroke="#06b6d4" stroke-width="2" marker-end="url(#cyanArrow)"/>
  <path d="M 830 380 Q 800 380 770 340" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4" marker-end="url(#amberArrow)"/>

  <!-- TIER 3: Presentation & Adaptive 3D UI (x=830, y=95, w=220, h=490) -->
  <g transform="translate(830, 95)" filter="url(#cardShadow)">
    <rect width="220" height="490" rx="12" fill="rgba(18, 22, 34, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
    <rect width="220" height="38" rx="12" fill="rgba(255, 255, 255, 0.04)"/>
    <text x="15" y="24" font-size="11" font-family="monospace" font-weight="700" fill="#06b6d4" letter-spacing="1">3. REACTIVE UI TIER</text>

    <!-- Component 1: 3D Galaxy Canvas -->
    <g transform="translate(14, 50)">
      <rect width="192" height="90" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#ffffff">Persistent 3D Galaxy</text>
      <text x="12" y="40" font-size="9" fill="#94a3b8">• 60 FPS Canvas Constellation</text>
      <text x="12" y="56" font-size="9" fill="#94a3b8">• Interactive Mouse Parallax</text>
      <text x="12" y="72" font-size="9" fill="#94a3b8">• Visual Knowledge Nodes</text>
      <text x="12" y="85" font-size="8" font-family="monospace" fill="#06b6d4">Zero External Libs</text>
    </g>

    <!-- Component 2: What-If Simulation -->
    <g transform="translate(14, 150)">
      <rect width="192" height="95" rx="8" fill="rgba(6, 182, 212, 0.06)" stroke="rgba(6, 182, 212, 0.3)"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#06b6d4">What-If Simulation HUD</text>
      <text x="12" y="40" font-size="9" fill="#94a3b8">• Counterfactual Toggles</text>
      <text x="12" y="56" font-size="9" fill="#94a3b8">• Real-time Readiness Surge</text>
      <text x="12" y="72" font-size="9" fill="#94a3b8">• Time-to-Hire: 18w → 12w</text>
      <text x="12" y="88" font-size="8" font-family="monospace" fill="#10b981">Dynamic Math Model</text>
    </g>

    <!-- Component 3: Amber Diff View -->
    <g transform="translate(14, 255)">
      <rect width="192" height="105" rx="8" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b"/>
      <text x="12" y="22" font-size="11" font-weight="800" fill="#f59e0b">⚡ Amber Diff Banner</text>
      <text x="12" y="40" font-size="9" fill="#fde68a">• Real-time Roadmap Diff</text>
      <text x="12" y="56" font-size="9" fill="#fde68a">• Injects Remedial Sprint</text>
      <text x="12" y="72" font-size="9" fill="#fde68a">• Defers Dependent React</text>
      <text x="12" y="88" font-size="8" font-family="monospace" fill="#f59e0b">Visible Adaptivity Proof</text>
    </g>

    <!-- Component 4: Inspection & Diagnostics -->
    <g transform="translate(14, 370)">
      <rect width="192" height="100" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="12" y="22" font-size="11" font-weight="700" fill="#ffffff">Diagnostic Probes</text>
      <text x="12" y="40" font-size="9" fill="#94a3b8">• Interactive Check-in Quiz</text>
      <text x="12" y="56" font-size="9" fill="#94a3b8">• Automated Grading</text>
      <text x="12" y="72" font-size="9" fill="#94a3b8">• Instant Re-plan Feedback</text>
      <text x="12" y="88" font-size="8" font-family="monospace" fill="#06b6d4">Dual Execution Engine</text>
    </g>
  </g>
</svg>
