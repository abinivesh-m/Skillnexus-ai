<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0c0f17; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="mCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Multi-Agent Lifecycle &amp; Dynamic Feedback Loop</text>
  <text x="40" y="62" font-size="12" fill="#94a3b8">The 6-stage autonomous orchestration and remediation loop</text>

  <!-- Node 1: Profile Agent -->
  <g transform="translate(40, 110)">
    <rect width="135" height="90" rx="10" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="24" font-size="11" font-weight="700" fill="#10b981">1. PROFILE AGENT</text>
    <text x="12" y="42" font-size="9" fill="#94a3b8">Audits Credentials</text>
    <text x="12" y="58" font-size="9" fill="#94a3b8">Claimed vs Verified</text>
    <text x="12" y="74" font-size="8" font-family="monospace" fill="#10b981">8 Skills Audited</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="175" y1="155" x2="205" y2="155" stroke="#06b6d4" stroke-width="2" marker-end="url(#mCyan)"/>

  <!-- Node 2: Gap Agent -->
  <g transform="translate(205, 110)">
    <rect width="135" height="90" rx="10" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="12" y="24" font-size="11" font-weight="700" fill="#06b6d4">2. GAP AGENT</text>
    <text x="12" y="42" font-size="9" fill="#94a3b8">Euclidean Delta</text>
    <text x="12" y="58" font-size="9" fill="#94a3b8">Severity Ranking</text>
    <text x="12" y="74" font-size="8" font-family="monospace" fill="#06b6d4">Readiness: 30.9%</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="340" y1="155" x2="370" y2="155" stroke="#06b6d4" stroke-width="2" marker-end="url(#mCyan)"/>

  <!-- Node 3: Curriculum Agent -->
  <g transform="translate(370, 110)">
    <rect width="135" height="90" rx="10" fill="rgba(139, 92, 246, 0.08)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="12" y="24" font-size="11" font-weight="700" fill="#8b5cf6">3. CURRICULUM</text>
    <text x="12" y="42" font-size="9" fill="#94a3b8">Topological DAG</text>
    <text x="12" y="58" font-size="9" fill="#94a3b8">Prerequisite Ordering</text>
    <text x="12" y="74" font-size="8" font-family="monospace" fill="#8b5cf6">6 Sprints / 118h</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="505" y1="155" x2="535" y2="155" stroke="#06b6d4" stroke-width="2" marker-end="url(#mCyan)"/>

  <!-- Node 4: Resource Agent -->
  <g transform="translate(535, 110)">
    <rect width="135" height="90" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <text x="12" y="24" font-size="11" font-weight="700" fill="#ffffff">4. RESOURCE</text>
    <text x="12" y="42" font-size="9" fill="#94a3b8">1 Free + 1 Paid</text>
    <text x="12" y="58" font-size="9" fill="#94a3b8">Validated Providers</text>
    <text x="12" y="74" font-size="8" font-family="monospace" fill="#94a3b8">12 Verified Links</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="670" y1="155" x2="700" y2="155" stroke="#06b6d4" stroke-width="2" marker-end="url(#mCyan)"/>

  <!-- Node 5: Assessor Agent -->
  <g transform="translate(700, 110)">
    <rect width="135" height="90" rx="10" fill="rgba(244, 63, 94, 0.08)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="12" y="24" font-size="11" font-weight="700" fill="#f43f5e">5. ASSESSOR</text>
    <text x="12" y="42" font-size="9" fill="#94a3b8">Diagnostic Checks</text>
    <text x="12" y="58" font-size="9" fill="#94a3b8">Fallacy Detection</text>
    <text x="12" y="74" font-size="8" font-family="monospace" fill="#f43f5e">Probing Core Mastery</text>
  </g>

  <!-- Arrow 5 -> 6 (Downwards) -->
  <path d="M 767 200 L 767 270" stroke="#f59e0b" stroke-width="2" marker-end="url(#mAmber)"/>

  <!-- Node 6: Mentor Agent (The Adaptive Core) -->
  <g transform="translate(620, 275)">
    <rect width="295" height="150" rx="12" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
    <text x="18" y="28" font-size="14" font-weight="800" fill="#f59e0b">6. MENTOR AGENT (ADAPTIVE ENGINE)</text>
    <text x="18" y="50" font-size="10" fill="#fde68a">• Real-Time Assessment Intervention (Score &lt; 66%)</text>
    <text x="18" y="68" font-size="10" fill="#fde68a">• Computes AMBER DIFF on the Active Graph</text>
    <text x="18" y="86" font-size="10" fill="#fde68a">• Dynamically Injects Remedial Foundational Sprint</text>
    <text x="18" y="104" font-size="10" fill="#fde68a">• Defers Downstream Advanced Modules (React, Node)</text>
    <text x="18" y="128" font-size="9" font-family="monospace" font-weight="700" fill="#f59e0b">⚡ Active Roadmap Mutation Confirmed</text>
  </g>

  <!-- Feedback Loop: Mentor Agent Back to Curriculum & UI -->
  <path d="M 620 350 L 437 350 L 437 205" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5" marker-end="url(#mAmber)"/>
  <rect x="450" y="325" width="150" height="20" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
  <text x="458" y="338" font-size="9" font-family="monospace" font-weight="700" fill="#f59e0b">ADAPTIVE RE-PLAN EVENT</text>

  <!-- What-If Simulation Loop -->
  <g transform="translate(40, 275)">
    <rect width="300" height="150" rx="12" fill="rgba(6, 182, 212, 0.06)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="18" y="28" font-size="13" font-weight="800" fill="#06b6d4">WHAT-IF COUNTERFACTUAL MODEL</text>
    <text x="18" y="50" font-size="10" fill="#94a3b8">• Simulated Mastery: Flip any skill toggle</text>
    <text x="18" y="68" font-size="10" fill="#94a3b8">• Immediate Metric Recalibration: 30.9% → 55.4%</text>
    <text x="18" y="86" font-size="10" fill="#94a3b8">• Time-to-Hire Optimization: 18w → 12w</text>
    <text x="18" y="104" font-size="10" fill="#94a3b8">• Prerequisite Sprints Dissolved with Transition</text>
    <text x="18" y="128" font-size="9" font-family="monospace" font-weight="700" fill="#06b6d4">⚡ Living Computational Model</text>
  </g>

  <!-- Connector from What-If to Gap Agent -->
  <path d="M 272 275 L 272 205" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5" marker-end="url(#mCyan)"/>
</svg>
