  <text x="918" y="33" font-size="11" font-weight="600" fill="#fff">★ Prompt: Aarav Patel</text>

  <rect x="1065" y="13" width="105" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
