<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">SkillNexus verified competency dashboard</title>
  <desc id="desc">Premium dark dashboard showing a live skill graph, verified readiness, gaps, roadmap and enterprise feature navigation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080a0c"/><stop offset="1" stop-color="#101419"/></linearGradient>
    <linearGradient id="lime" x2="1"><stop stop-color="#c7ff4a"/><stop offset="1" stop-color="#77d977"/></linearGradient>
    <linearGradient id="panel" y2="1"><stop stop-color="#171b20"/><stop offset="1" stop-color="#0f1215"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g opacity=".4" fill="none" stroke="#c7ff4a" stroke-width="1">
    <ellipse cx="610" cy="285" rx="300" ry="78"/><ellipse cx="610" cy="285" rx="220" ry="48"/>
    <path d="M310 285 430 180 610 285 760 145 910 250 610 430 430 180"/>
  </g>
  <g opacity=".8">
    <circle cx="430" cy="180" r="8" fill="#f2a93b" filter="url(#glow)"/><circle cx="610" cy="285" r="10" fill="#c7ff4a" filter="url(#glow)"/>
    <circle cx="760" cy="145" r="7" fill="#5fd4c4" filter="url(#glow)"/><circle cx="910" cy="250" r="6" fill="#ff6b5e" filter="url(#glow)"/>
    <circle cx="520" cy="390" r="7" fill="#5fd4c4"/><circle cx="340" cy="335" r="5" fill="#c7ff4a"/>
  </g>
  <rect x="0" y="0" width="1200" height="54" fill="#0a0c0e" stroke="#252a2f"/>
  <g font-family="Arial, sans-serif"><text x="38" y="33" fill="#c7ff4a" font-size="17" font-weight="700">◇ SkillNexus</text><text x="180" y="33" fill="#707982" font-size="10" letter-spacing="2">COMPETENCY ENGINE</text>
    <rect x="925" y="15" width="108" height="25" rx="13" fill="#11161a" stroke="#30383b"/><circle cx="941" cy="27" r="4" fill="#c7ff4a"/><text x="951" y="31" fill="#a8b0ad" font-size="10">gemini online</text>
    <rect x="1045" y="12" width="115" height="31" rx="16" fill="#c7ff4a"/><text x="1061" y="32" fill="#11150c" font-size="11" font-weight="700">Start check-in</text>
  </g>
  <g font-family="Arial, sans-serif"><text x="48" y="115" fill="#8b9691" font-size="10" letter-spacing="3">MULTI-AGENT COMPETENCY ENGINE</text><text x="48" y="184" fill="#f2f3ef" font-size="53" font-family="Georgia, serif">Resumes claim.</text><text x="48" y="239" fill="#c7ff4a" font-size="55" font-family="Georgia, serif" font-style="italic">We verify.</text><text x="50" y="278" fill="#9da6a8" font-size="13">Six agents audit evidence, test uncertain skills, and</text><text x="50" y="299" fill="#9da6a8" font-size="13">rewrite the path to a target role.</text>
    <rect x="50" y="330" width="150" height="30" rx="15" fill="#c7ff4a"/><text x="68" y="350" fill="#11150c" font-size="11" font-weight="700">What if I learn React?</text>
    <rect x="48" y="390" width="420" height="1" fill="#252a2f"/><text x="50" y="420" fill="#687176" font-size="9" letter-spacing="2">BENCHMARK ROLES</text><text x="50" y="442" fill="#eef0ec" font-size="18">6</text><text x="190" y="420" fill="#687176" font-size="9" letter-spacing="2">TRACKED SKILLS</text><text x="190" y="442" fill="#eef0ec" font-size="18">33</text><text x="330" y="420" fill="#687176" font-size="9" letter-spacing="2">SCORING</text><text x="330" y="442" fill="#eef0ec" font-size="18">Deterministic</text></g>
  <rect x="790" y="90" width="350" height="300" rx="18" fill="url(#panel)" stroke="#38413c"/>
  <g font-family="Arial, sans-serif"><text x="815" y="122" fill="#77827c" font-size="9" letter-spacing="2">VERIFIED READINESS</text><text x="1055" y="122" fill="#a7b0aa" font-size="10">Full Stack Developer</text><text x="815" y="183" fill="#f1f3ee" font-size="54" font-family="monospace">30.9</text><text x="1005" y="183" fill="#a6afaa" font-size="18">%</text><rect x="815" y="204" width="300" height="5" rx="3" fill="#252b2a"/><rect x="815" y="204" width="93" height="5" rx="3" fill="url(#lime)"/><text x="815" y="240" fill="#8c9692" font-size="11">Self-reported</text><text x="1080" y="240" fill="#b4bbb6" font-size="11">53.6%</text><text x="815" y="266" fill="#8c9692" font-size="11">Credibility delta</text><text x="1080" y="266" fill="#f2a93b" font-size="11">+22.7%</text><text x="815" y="292" fill="#8c9692" font-size="11">Time to target</text><text x="1070" y="292" fill="#f1f3ee" font-size="11">13 weeks</text><text x="815" y="329" fill="#c7ff4a" font-size="11" font-weight="700">Explain this number ↗</text><path d="M815 358 Q950 320 1115 340" fill="none" stroke="#c7ff4a" stroke-width="2"/><text x="815" y="378" fill="#687176" font-size="8" letter-spacing="1">PROJECTED READINESS IF THE PLAN IS FOLLOWED</text></g>
  <rect x="48" y="490" width="1104" height="38" rx="8" fill="#11161a" stroke="#2c3435"/><g font-family="monospace" font-size="10"><text x="64" y="514" fill="#c7ff4a">01</text><text x="90" y="514" fill="#aeb7b2">CLAIMED VS VERIFIED</text><text x="260" y="514" fill="#c7ff4a">02</text><text x="286" y="514" fill="#aeb7b2">WHAT-IF ENGINE</text><text x="445" y="514" fill="#c7ff4a">03</text><text x="471" y="514" fill="#aeb7b2">ADAPTIVE ROADMAP</text><text x="650" y="514" fill="#c7ff4a">04</text><text x="676" y="514" fill="#aeb7b2">CAREER RADAR</text><text x="820" y="514" fill="#c7ff4a">05</text><text x="846" y="514" fill="#aeb7b2">MARKET SHOCK</text><text x="980" y="514" fill="#c7ff4a">06</text><text x="1006" y="514" fill="#aeb7b2">AST PROBE</text></g>
  <g font-family="Arial, sans-serif"><rect x="48" y="556" width="330" height="110" rx="12" fill="url(#panel)" stroke="#2b3235"/><rect x="394" y="556" width="330" height="110" rx="12" fill="url(#panel)" stroke="#2b3235"/><rect x="740" y="556" width="412" height="110" rx="12" fill="url(#panel)" stroke="#c7ff4a"/><text x="70" y="583" fill="#eef0ec" font-size="15" font-weight="700">Learner</text><text x="70" y="603" fill="#7f8a86" font-size="10">Claimed vs verified · 5/8 verified</text><text x="70" y="632" fill="#c7ff4a" font-size="11">Certifications</text><text x="175" y="632" fill="#9da6a8" font-size="11">Projects</text><text x="416" y="583" fill="#eef0ec" font-size="15" font-weight="700">Gaps</text><text x="416" y="603" fill="#7f8a86" font-size="10">Ranked by weighted severity</text><text x="416" y="635" fill="#f2a93b" font-size="12">JavaScript</text><text x="520" y="635" fill="#ff6b5e" font-size="12">React</text><text x="762" y="583" fill="#eef0ec" font-size="15" font-weight="700">Roadmap</text><text x="762" y="603" fill="#7f8a86" font-size="10">Prerequisite-sequenced sprints</text><text x="762" y="638" fill="#c7ff4a" font-size="12">6 adaptive modules · 13 weeks</text></g>
</svg>
