      <rect x="320" y="8" width="60" height="16" rx="3" fill="#f3efe6"/>
      <text x="328" y="19" font-size="8" fill="#57524b">24 Hours</text>

      <text x="15" y="38" font-size="12" font-weight="700" fill="#1e1b18">React 19: Components, Hooks & State Systems</text>
      <text x="15" y="52" font-size="9" fill="#57524b">Prerequisite: Modern JavaScript</text>

      <rect x="15" y="58" width="175" height="18" rx="4" fill="#fbf9f5" stroke="#e6dfd3"/>
