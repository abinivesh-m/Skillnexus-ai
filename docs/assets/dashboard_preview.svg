      <text x="145" y="20" font-size="9" fill="#94a3b8">Claimed: 2</text>
      <rect x="215" y="6" width="75" height="18" rx="3" fill="rgba(244,63,94,0.15)"/>
      <text x="222" y="19" font-size="9" font-weight="700" fill="#f43f5e">Unverified (0)</text>
    </g>

    <g transform="translate(20, 240)">
      <!-- React -->
      <rect width="300" height="30" rx="5" fill="rgba(244,63,94,0.05)" stroke="rgba(244,63,94,0.2)"/>
      <text x="10" y="20" font-size="11" font-weight="700" fill="#f43f5e">React</text>
      <text x="145" y="20" font-size="9" fill="#94a3b8">Claimed: 1</text>
      <rect x="215" y="6" width="75" height="18" rx="3" fill="rgba(244,63,94,0.15)"/>
      <text x="222" y="19" font-size="9" font-weight="700" fill="#f43f5e">Missing (0)</text>
    </g>
  </g>

