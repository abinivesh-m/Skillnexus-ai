      <text x="12" y="24" font-size="13">⚡</text>
      <text x="32" y="20" font-size="10" font-weight="800" fill="#f59e0b">ADAPTIVE RE-PLAN TRIGGERED</text>
      <text x="32" y="36" font-size="9" fill="#fde68a">Learner scored 33% on JavaScript → Injected Remedial Sprint &amp; delayed React.</text>
    </g>

    <!-- Remedial Module (Sprint 1) -->
    <g transform="translate(20, 120)">
      <rect width="340" height="85" rx="8" fill="rgba(245,158,11,0.05)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
      <text x="12" y="20" font-size="8" font-family="monospace" font-weight="700" fill="#f59e0b">SPRINT 1 · 12 HOURS</text>
      <rect x="200" y="8" width="130" height="16" rx="3" fill="rgba(245,158,11,0.2)"/>
      <text x="205" y="19" font-size="8" font-weight="800" fill="#f59e0b">⚡ Injected by Mentor</text>

      <text x="12" y="38" font-size="11" font-weight="700" fill="#fff">Remedial: Scope, Closures &amp; Context</text>
      <text x="12" y="52" font-size="8" fill="#94a3b8">Prerequisite: Basic Syntax Review</text>

      <rect x="12" y="60" width="150" height="18" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="18" y="72" font-size="8" fill="#06b6d4">Free: MDN JS Fundamentals</text>
      <rect x="175" y="60" width="155" height="18" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
      <text x="182" y="72" font-size="8" fill="#8b5cf6">Deep: Frontend Masters</text>
