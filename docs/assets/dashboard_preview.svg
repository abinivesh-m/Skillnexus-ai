      <rect width="340" height="150" rx="12" fill="rgba(15, 18, 28, 0.75)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="30" font-size="11" fill="#94a3b8">Verified Readiness</text>
      <text x="240" y="34" font-size="24" font-weight="800" font-family="monospace" fill="#06b6d4">30.9%</text>

      <rect x="20" y="44" width="300" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
      <rect x="20" y="44" width="93" height="6" rx="3" fill="#06b6d4" filter="url(#neonGlow)"/>

