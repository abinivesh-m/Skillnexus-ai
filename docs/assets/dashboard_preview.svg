      <rect width="270" height="32" rx="5" fill="#fbf9f5" stroke="#e6dfd3"/>
      <text x="12" y="20" font-size="11" font-weight="600" fill="#1e1b18">SQL</text>
      <rect x="135" y="7" width="55" height="18" rx="3" fill="#f3efe6"/>
      <text x="142" y="19" font-size="9" fill="#57524b">Claimed: 4</text>
      <rect x="195" y="7" width="65" height="18" rx="3" fill="#d1fae5"/>
      <text x="202" y="19" font-size="9" font-weight="700" fill="#047857">Lvl 3 Verified</text>
