<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#07080c; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="bgGlowCyan" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowViolet" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glowing Background -->
  <rect width="1200" height="700" fill="#07080c"/>
  <rect width="1200" height="700" fill="url(#bgGlowCyan)"/>
  <rect width="1200" height="700" fill="url(#bgGlowViolet)"/>

  <!-- 3D Constellation Wireframe Background Effect -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="120" x2="220" y2="280"/>
    <line x1="220" y1="280" x2="380" y2="180"/>
    <line x1="380" y1="180" x2="620" y2="140"/>
    <line x1="620" y1="140" x2="880" y2="220"/>
    <line x1="880" y1="220" x2="1100" y2="160"/>
    <line x1="220" y1="280" x2="310" y2="440"/>
    <line x1="620" y1="140" x2="720" y2="340"/>
    <line x1="720" y1="340" x2="880" y2="220"/>
    <line x1="880" y1="220" x2="940" y2="420"/>
  </g>

  <!-- Constellation Nodes -->
  <circle cx="80" cy="120" r="3" fill="#10b981"/>
  <circle cx="220" cy="280" r="4" fill="#06b6d4" filter="url(#neonGlow)"/>
  <circle cx="380" cy="180" r="3" fill="#10b981"/>
  <circle cx="620" cy="140" r="5" fill="#f43f5e" filter="url(#neonGlow)"/>
  <circle cx="880" cy="220" r="4" fill="#f59e0b" filter="url(#neonGlow)"/>
  <circle cx="1100" cy="160" r="3" fill="#8b5cf6"/>

