    <line x1="20" y1="46" x2="360" y2="46" stroke="rgba(255,255,255,0.06)"/>

    <!-- Gap 1: React with WHAT-IF TOGGLE -->
    <g transform="translate(20, 60)">
      <rect width="340" height="85" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
      <rect width="4" height="85" rx="2" fill="#f43f5e"/>
      <text x="15" y="25" font-size="13" font-weight="700" fill="#fff">React</text>
