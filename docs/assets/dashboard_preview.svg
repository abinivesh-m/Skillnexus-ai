    <text x="25" y="80" font-size="11" fill="#94a3b8">Static course lists lose. Toggle "What if I learn React?" below and watch the computational model</text>
    <text x="25" y="96" font-size="11" fill="#94a3b8">recalculate readiness, prune prerequisite weeks, and adapt sprints live.</text>

    <!-- 3D Gyroscope Box inside Hero -->
    <g transform="translate(560, 15)">
