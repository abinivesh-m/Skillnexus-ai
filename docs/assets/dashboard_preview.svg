      <rect x="220" y="8" width="80" height="18" rx="3" fill="#ffe4e6"/>
      <text x="225" y="20" font-size="8" font-weight="700" fill="#be123c">Weight 5 · Sev 20</text>
      <text x="15" y="38" font-size="9" fill="#57524b">Unverified Knowledge: Claimed 2/5, verified 0.</text>
