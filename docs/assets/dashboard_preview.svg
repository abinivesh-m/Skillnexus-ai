      <ellipse cx="92" cy="60" rx="45" ry="45" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <ellipse cx="92" cy="60" rx="55" ry="20" fill="none" stroke="#06b6d4" stroke-width="1.5" transform="rotate(-25 92 60)"/>
      <circle cx="92" cy="60" r="10" fill="#06b6d4" filter="url(#neonGlow)"/>
      <circle cx="55" cy="40" r="4" fill="#10b981"/>
      <circle cx="130" cy="50" r="4" fill="#f43f5e"/>
      <circle cx="85" cy="85" r="4" fill="#f59e0b"/>
      <text x="92" y="112" font-size="8" font-family="monospace" fill="#06b6d4" text-anchor="middle">3D KNOWLEDGE CORE</text>
    </g>

