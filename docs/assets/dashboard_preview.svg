      <text x="195" y="26" font-size="9" font-family="monospace" font-weight="700" fill="#06b6d4">⚡ What if I learn this?</text>

      <text x="15" y="48" font-size="9" font-family="monospace" fill="#f43f5e">WEIGHT 5 · SEVERITY 20 · CRITICAL VOID</text>
      <text x="15" y="68" font-size="9" fill="#94a3b8">Flipping toggle jumps readiness 30.9% → 55.4% and saves 6 weeks!</text>
    </g>

    <!-- Gap 2: JavaScript with WHAT-IF TOGGLE -->
    <g transform="translate(20, 155)">
      <rect width="340" height="85" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
      <rect width="4" height="85" rx="2" fill="#f43f5e"/>
      <text x="15" y="25" font-size="13" font-weight="700" fill="#fff">JavaScript</text>
      <rect x="180" y="10" width="150" height="24" rx="12" fill="rgba(6,182,212,0.15)" stroke="#06b6d4"/>
      <text x="195" y="26" font-size="9" font-family="monospace" font-weight="700" fill="#06b6d4">⚡ What if I learn this?</text>

      <text x="15" y="48" font-size="9" font-family="monospace" fill="#f43f5e">WEIGHT 5 · SEVERITY 20 · UNVERIFIED</text>
      <text x="15" y="68" font-size="9" fill="#94a3b8">Unlocks downstream frameworks &amp; asynchronous mastery.</text>
    </g>
  </g>

  <!-- COLUMN 3: Adaptive Roadmap & Amber Diff (x=785, y=245, w=380, h=430) -->
  <g transform="translate(785, 245)">
    <rect width="380" height="430" rx="12" fill="rgba(15, 18, 28, 0.75)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#fff">Adaptive Learning Roadmap</text>
    <line x1="20" y1="46" x2="360" y2="46" stroke="rgba(255,255,255,0.06)"/>

