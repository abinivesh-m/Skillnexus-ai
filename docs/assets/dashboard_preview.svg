      <rect x="195" y="7" width="65" height="18" rx="3" fill="#d1fae5"/>
      <text x="202" y="19" font-size="9" font-weight="700" fill="#047857">Lvl 3 Verified</text>
    </g>

    <g transform="translate(20, 235)">
