  <rect x="35" y="14" width="28" height="28" rx="6" fill="#06b6d4" filter="url(#neonGlow)"/>
  <text x="43" y="33" font-size="14" font-weight="900" fill="#000">⚡</text>
  <text x="72" y="34" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Skill<tspan fill="#06b6d4">Nexus</tspan>.ai</text>
  <rect x="200" y="19" width="160" height="20" rx="10" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)"/>
  <text x="210" y="33" font-size="9" font-family="monospace" font-weight="700" fill="#06b6d4">AUTONOMOUS MULTI-AGENT</text>

  <!-- Header Action Buttons -->
