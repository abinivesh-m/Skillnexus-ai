      <text x="222" y="19" font-size="9" font-weight="700" fill="#10b981">Lvl 3 Verified</text>
    </g>

    <g transform="translate(20, 160)">
      <!-- SQL -->
      <rect width="300" height="30" rx="5" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
      <text x="10" y="20" font-size="11" font-weight="600" fill="#fff">SQL</text>
      <text x="145" y="20" font-size="9" fill="#94a3b8">Claimed: 4</text>
      <rect x="215" y="6" width="75" height="18" rx="3" fill="rgba(16,185,129,0.15)"/>
      <text x="222" y="19" font-size="9" font-weight="700" fill="#10b981">Lvl 3 Verified</text>
    </g>

    <g transform="translate(20, 200)">
